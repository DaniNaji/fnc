services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meinueberblick_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:${FRONTEND_PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-in-production-random-32-chars}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - USE_MOCK_AI=${USE_MOCK_AI:-true}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-mock-key}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meinueberblick_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
